name: Apply Phoenix repair status patch
on:
  push:
    branches:
      - feature/phoenix-repair-inspection
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply code changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          s = app.read_text()
          s = s.replace('import type { DashboardPayload, GearAsset, MemberCoverage, SupplyPart, SupplyProbePayload } from "./types";\n', 'import type { DashboardPayload, GearAsset, MemberCoverage, SupplyPart, SupplyProbePayload } from "./types";\nimport "./phoenix.css";\n')
          s = s.replace('const isWarehouseAsset = (asset:GearAsset) => asset.locationType === "Warehouse" || /turnout\\s*gear\\s*supply\\s*warehouse/i.test(`${asset.currentLocation} ${asset.assignedTo}`);', 'const isPhoenixAsset = (asset:GearAsset) => /phoenix\\s*gear\\s*repair\\s*supply\\s*room/i.test(`${asset.currentLocation} ${asset.assignedTo}`);\nconst isWarehouseAsset = (asset:GearAsset) => !isPhoenixAsset(asset) && (asset.locationType === "Warehouse" || /turnout\\s*gear\\s*supply\\s*warehouse/i.test(`${asset.currentLocation} ${asset.assignedTo}`));')
          s = s.replace('const due=filtered.filter(i=>requiresAnnualInspection(i)&&i.daysUntilDue!==null&&i.daysUntilDue<=(data?.lookaheadDays||30)).sort((a,b)=>(a.daysUntilDue??9999)-(b.daysUntilDue??9999));', 'const due=filtered.filter(i=>!isPhoenixAsset(i)&&requiresAnnualInspection(i)&&i.daysUntilDue!==null&&i.daysUntilDue<=(data?.lookaheadDays||30)).sort((a,b)=>(a.daysUntilDue??9999)-(b.daysUntilDue??9999));')
          s = s.replace('  const inspectionItems=[...filtered.filter(requiresAnnualInspection)].filter(i=>{', '  const inspectionItems=[...filtered.filter(i=>requiresAnnualInspection(i)&&!isPhoenixAsset(i))].filter(i=>{')
          s = s.replace('  const warehouseItems=useMemo(()=>all.filter(i=>isWarehouseAsset(i)),[all]);\n  const reserveItems=useMemo(()=>all.filter(i=>i.locationType==="Reserve"),[all]);', '  const phoenixItems=useMemo(()=>all.filter(isPhoenixAsset),[all]);\n  const warehouseItems=useMemo(()=>all.filter(i=>isWarehouseAsset(i)),[all]);\n  const reserveItems=useMemo(()=>all.filter(i=>i.locationType==="Reserve"&&!isPhoenixAsset(i)),[all]);')
          s = s.replace('  const dueWithin48=all.filter(i=>requiresAnnualInspection(i)&&i.daysUntilDue!==null&&i.daysUntilDue>=0&&i.daysUntilDue<=2).length;\n  const inspectionDue30=all.filter(i=>requiresAnnualInspection(i)&&i.daysUntilDue!==null&&i.daysUntilDue<=30);', '  const dueWithin48=all.filter(i=>!isPhoenixAsset(i)&&requiresAnnualInspection(i)&&i.daysUntilDue!==null&&i.daysUntilDue>=0&&i.daysUntilDue<=2).length;\n  const inspectionDue30=all.filter(i=>!isPhoenixAsset(i)&&requiresAnnualInspection(i)&&i.daysUntilDue!==null&&i.daysUntilDue<=30);')
          old = '<section className="inspection-split"><button onClick={()=>openInspection("all","issued")}><div><Users/><span>ISSUED GEAR DUE</span></div><strong>{issuedDue30.length}</strong><small>{issuedOverdue} overdue · {formatMinutes(issuedMinutes)} workload</small><ChevronRight/></button><button onClick={()=>openInspection("all","warehouse")}><div><Warehouse/><span>WAREHOUSE GEAR DUE</span></div><strong>{warehouseDue30.length}</strong><small>{warehouseOverdue} overdue · {formatMinutes(warehouseMinutes)} workload</small><ChevronRight/></button></section>'
          new = '<section className="inspection-split phoenix-three"><button onClick={()=>openInspection("all","issued")}><div><Users/><span>ISSUED GEAR DUE</span></div><strong>{issuedDue30.length}</strong><small>{issuedOverdue} overdue · {formatMinutes(issuedMinutes)} workload</small><ChevronRight/></button><button onClick={()=>openInspection("all","warehouse")}><div><Warehouse/><span>WAREHOUSE GEAR DUE</span></div><strong>{warehouseDue30.length}</strong><small>{warehouseOverdue} overdue · {formatMinutes(warehouseMinutes)} workload</small><ChevronRight/></button><button className="phoenix-status" onClick={()=>{setQuery("Phoenix Gear Repair Supply Room");setLocationFilter("All locations");setGearFilter("All gear");setView("assets")}}><div><Wrench/><span>OUT FOR REPAIR / INSPECTION</span></div><strong>{phoenixItems.length}</strong><small>Phoenix Gear Repair · excluded from due queue</small><ChevronRight/></button></section>'
          s = s.replace(old, new)
          app.write_text(s)

          worker = Path('src/worker.ts')
          w = worker.read_text()
          w = w.replace('function requiresAnnualInspection(asset: Pick<GearAsset, "gearType">): boolean {\n  return asset.gearType === "Coat" || asset.gearType === "Pant";\n}\n', 'function requiresAnnualInspection(asset: Pick<GearAsset, "gearType">): boolean {\n  return asset.gearType === "Coat" || asset.gearType === "Pant";\n}\n\nfunction isPhoenixAsset(asset: Pick<GearAsset, "currentLocation" | "assignedTo">): boolean {\n  return /phoenix\\s*gear\\s*repair\\s*supply\\s*room/i.test(`${asset.currentLocation} ${asset.assignedTo}`);\n}\n')
          w = w.replace('  // Department policy: only structural coats and pants receive the annual inspection.\n  const inspectionGear = gear.filter(requiresAnnualInspection);', '  // Department policy: only structural coats and pants receive the annual inspection.\n  // Gear transferred to Phoenix Gear Repair is already in the repair/inspection workflow,\n  // so it is excluded from active due/overdue workload until it returns.\n  const inspectionGear = gear.filter(x => requiresAnnualInspection(x) && !isPhoenixAsset(x));')
          w = w.replace('      warehouseItems: gear.filter(x=>x.locationType==="Warehouse").length,', '      warehouseItems: gear.filter(x=>x.locationType==="Warehouse"&&!isPhoenixAsset(x)).length,')
          w = w.replace('    warehouseInventory: gear.filter(x=>x.locationType==="Warehouse"||x.locationType==="Reserve"),', '    warehouseInventory: gear.filter(x=>!isPhoenixAsset(x)&&(x.locationType==="Warehouse"||x.locationType==="Reserve")),')
          worker.write_text(w)
          PY
      - name: Verify patch applied
        run: |
          grep -q 'OUT FOR REPAIR / INSPECTION' src/App.tsx
          grep -q 'function isPhoenixAsset' src/worker.ts
          grep -q 'phoenix-three' src/App.tsx
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/worker.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Phoenix repair and inspection workflow'
          git push
