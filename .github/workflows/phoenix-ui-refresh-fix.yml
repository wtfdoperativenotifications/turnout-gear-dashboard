name: Phoenix UI and refresh fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phoenix-ui-refresh-fix.yml'
      - '.github/phoenix-ui-refresh-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch Phoenix presentation and refresh timeout
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          replacements = [
            (
              'const isPhoenixAsset = (asset:GearAsset) => /phoenix\\s*gear\\s*repair\\s*supply\\s*room/i.test(`${asset.currentLocation} ${asset.assignedTo}`);',
              'const isPhoenixAsset = (asset:GearAsset) => /phoenix.*(?:gear.*)?repair|(?:gear.*)?repair.*phoenix/i.test(`${asset.currentLocation} ${asset.assignedTo}`);'
            ),
            (
              'function LocationBadge({item}:{item:GearAsset}){return <span className={`location ${item.locationType.toLowerCase().replaceAll(" ","-")}`}>{item.locationType}</span>}',
              'function LocationBadge({item}:{item:GearAsset}){if(isPhoenixAsset(item))return <span className="location repair-inspection">Repair / Inspection</span>;return <span className={`location ${item.locationType.toLowerCase().replaceAll(" ","-")}`}>{item.locationType}</span>}'
            ),
            (
              'function DueBadge({item}:{item:GearAsset}){if(!requiresAnnualInspection(item))return <span className="due inventory-only">Inventory only</span>;return <span className={`due ${item.status.toLowerCase().replace(" ","-")}`}>{dueText(item.daysUntilDue)}</span>}',
              'function DueBadge({item}:{item:GearAsset}){if(isPhoenixAsset(item))return <span className="due repair-inspection">Out for repair / inspection</span>;if(!requiresAnnualInspection(item))return <span className="due inventory-only">Inventory only</span>;return <span className={`due ${item.status.toLowerCase().replace(" ","-")}`}>{dueText(item.daysUntilDue)}</span>}'
            ),
            (
              '  const inspectionAssets=m.assets.filter(requiresAnnualInspection);',
              '  const inspectionAssets=m.assets.filter(a=>requiresAnnualInspection(a)&&!isPhoenixAsset(a));'
            ),
            (
              '  const load=async()=>{setLoading(true);setError("");try{const r=await fetch("/api/dashboard");if(!r.ok)throw new Error(`Dashboard request failed (${r.status})`);setData(await r.json())}catch(e){setError(e instanceof Error?e.message:"Unable to load dashboard")}finally{setLoading(false)}};',
              '  const load=async()=>{const controller=new AbortController();const timer=window.setTimeout(()=>controller.abort(),15000);setLoading(true);setError("");try{const r=await fetch("/api/dashboard",{signal:controller.signal,cache:"no-store"});if(!r.ok)throw new Error(`Dashboard request failed (${r.status})`);setData(await r.json())}catch(e){setError(e instanceof DOMException&&e.name==="AbortError"?"Dashboard refresh timed out after 15 seconds. The last loaded data is still shown.":e instanceof Error?e.message:"Unable to load dashboard")}finally{window.clearTimeout(timer);setLoading(false)}};'
            ),
            (
              'due30:memberRows.filter(m=>m.assets.some(a=>requiresAnnualInspection(a)&&a.daysUntilDue!==null&&a.daysUntilDue<=30)).length',
              'due30:memberRows.filter(m=>m.assets.some(a=>!isPhoenixAsset(a)&&requiresAnnualInspection(a)&&a.daysUntilDue!==null&&a.daysUntilDue<=30)).length'
            ),
            (
              'if(memberPreset==="due30") return m.assets.some(a=>requiresAnnualInspection(a)&&a.daysUntilDue!==null&&a.daysUntilDue<=30);',
              'if(memberPreset==="due30") return m.assets.some(a=>!isPhoenixAsset(a)&&requiresAnnualInspection(a)&&a.daysUntilDue!==null&&a.daysUntilDue<=30);'
            ),
            (
              '<td><b>{i.locationType==="Warehouse"?"Warehouse stock":i.assignedTo}</b><small>{i.currentLocation} · <LocationBadge item={i}/></small></td>',
              '<td><b>{isPhoenixAsset(i)?"Out for Repair / Inspection":i.locationType==="Warehouse"?"Warehouse stock":i.assignedTo}</b><small>{i.currentLocation} · <LocationBadge item={i}/></small></td>'
            ),
            (
              '<div><small>Assigned to</small><strong>{asset.locationType==="Warehouse"?"Warehouse stock":asset.assignedTo}</strong></div>',
              '<div><small>Status / assignment</small><strong>{isPhoenixAsset(asset)?"Out for Repair / Inspection":asset.locationType==="Warehouse"?"Warehouse stock":asset.assignedTo}</strong></div>'
            ),
            (
              '<div className="asset-policy-note"><Info/><span>{requiresAnnualInspection(asset)?"This coat or pant is included in the annual inspection workload.":"This PPE item remains in inventory and lifecycle planning but is excluded from the annual inspection workload."}</span></div>',
              '<div className="asset-policy-note"><Info/><span>{isPhoenixAsset(asset)?"This item is at Phoenix Gear Repair and is excluded from the active annual inspection workload and usable warehouse stock until it returns.":requiresAnnualInspection(asset)?"This coat or pant is included in the annual inspection workload.":"This PPE item remains in inventory and lifecycle planning but is excluded from the annual inspection workload."}</span></div>'
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected App.tsx pattern not found:\n{old[:180]}')
            text = text.replace(old, new, 1)

          path.write_text(text)

          css = Path('src/phoenix.css')
          css_text = css.read_text()
          additions = '''

/* Phoenix assets are inventory records, but not usable warehouse stock or active due work. */
.location.repair-inspection,.due.repair-inspection{color:#d7c2ff;border-color:rgba(176,140,255,.45);background:rgba(176,140,255,.12)}
'''
          if '.location.repair-inspection' not in css_text:
            css.write_text(css_text.rstrip()+additions)

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/phoenix.css
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix Phoenix asset presentation and refresh timeout"
          git push
